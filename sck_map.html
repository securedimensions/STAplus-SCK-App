<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SCK location</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; height: 100%; width: 100%; }
    .hint {
      position: absolute; z-index: 1000; left: 12px; bottom: 12px;
      background: rgba(255,255,255,0.92); padding: 8px 10px; border-radius: 6px;
      font: 13px/1.3 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      max-width: 280px;
    }
    #locate {
      position: absolute; z-index: 1000; right: 12px; top: 12px;
      font: 13px system-ui, sans-serif; padding: 6px 10px;
      cursor: pointer;
    }
    /* Grab-hand hotspot is the palm. Crosshair clicks at the intersection. */
    .leaflet-container,
    .leaflet-grab,
    .leaflet-grab .leaflet-interactive {
      cursor: crosshair !important;
    }
    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      cursor: grab;
    }
    .leaflet-dragging .leaflet-marker-draggable {
      cursor: grabbing;
    }
    .sck-popup .leaflet-popup-content {
      margin: 8px 10px 10px;
      min-width: 340px;
    }
    .sck-charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
      font: 11px/1.2 system-ui, sans-serif;
      color: #222;
    }
    .sck-chart-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 600;
    }
    .sck-chart-head .val { font-variant-numeric: tabular-nums; font-weight: 500; }
    .sck-chart-plot {
      display: grid;
      grid-template-columns: 2.6em 1fr;
      grid-template-rows: auto auto;
      column-gap: 4px;
      align-items: stretch;
    }
    .sck-y {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #555;
      font-size: 9px;
      line-height: 1;
      padding: 1px 0;
    }
    .sck-chart-plot canvas {
      grid-column: 2;
      grid-row: 1;
      display: block;
      width: 100%;
      height: 48px;
    }
    .sck-x {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font-variant-numeric: tabular-nums;
      color: #555;
      font-size: 9px;
      line-height: 1.2;
      margin-top: 2px;
    }
    .sck-charts-caption {
      grid-column: 1 / -1;
      color: #666;
      font: 11px system-ui, sans-serif;
    }
    .sck-charts-empty {
      grid-column: 1 / -1;
      color: #666;
      font: 12px system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <button id="locate" type="button">Use my location</button>
  <div class="hint">Click the map or drag the marker to set the Thing location. Confirm in the app before publishing. After the kit is connected, click the marker for live charts.</div>
  <script>
    let map, marker, bridge;
    let chartData = [];
    let kitConnected = false;
    let openOnFirstReading = false;
    const CHART_WINDOW_S = 30 * 60;
    const SERIES = [
      { key: "temperature", label: "Temp °C", color: "#d9480f" },
      { key: "humidity", label: "Humidity %", color: "#1c7ed6" },
      { key: "light", label: "Light lux", color: "#f59f00" },
      { key: "noise", label: "Noise dBA", color: "#7048e8" },
      { key: "pressure", label: "Pressure kPa", color: "#0ca678" },
      { key: "pm1", label: "PM1", color: "#495057" },
      { key: "pm25", label: "PM2.5", color: "#c92a2a" },
      { key: "pm10", label: "PM10", color: "#e8590c" }
    ];

    function setMarker(lat, lon, pan) {
      if (lat == null || lon == null || Number.isNaN(lat) || Number.isNaN(lon)) {
        return;
      }
      if (!map) {
        initMap();
        if (!map) {
          setTimeout(function () { setMarker(lat, lon, pan); }, 50);
          return;
        }
      }
      if (marker) {
        marker.setLatLng([lat, lon]);
      } else {
        marker = L.marker([lat, lon], { draggable: true }).addTo(map);
        marker.on("dragstart", function () {
          if (marker.isPopupOpen()) marker.closePopup();
        });
        marker.on("dragend", function () {
          const p = marker.getLatLng();
          if (bridge) bridge.markerMovedTo(p.lat, p.lng);
        });
        marker.on("popupopen", function () {
          if (!kitConnected) {
            marker.closePopup();
            return;
          }
          requestAnimationFrame(redrawCharts);
        });
        marker.on("popupclose", function () {
          openOnFirstReading = false;
        });
        marker.bindTooltip("Connect the kit, then click the marker for charts", {
          direction: "top",
          offset: [0, -12],
          opacity: 0.95
        });
      }
      if (kitConnected) ensureChartPopup();
      if (pan) map.setView([lat, lon], Math.max(map.getZoom(), 13));
      if (bridge) bridge.markerMovedTo(lat, lon);
    }

    window.sckMarkerCoords = function () {
      if (!marker) return "";
      const p = marker.getLatLng();
      return String(p.lat) + "," + String(p.lng);
    };

    function chartPopupHtml() {
      let html = '<div class="sck-charts">';
      html += '<div class="sck-charts-caption" id="sck-charts-caption">Up to 30 minutes</div>';
      html += '<div class="sck-charts-empty" id="sck-charts-empty">Connect the kit to plot readings.</div>';
      SERIES.forEach(function (s) {
        html += '<div class="sck-chart" data-key="' + s.key + '">';
        html += '<div class="sck-chart-head"><span>' + s.label + '</span><span class="val">—</span></div>';
        html += '<div class="sck-chart-plot">';
        html += '<div class="sck-y"><span class="sck-ymax">—</span><span class="sck-ymin">—</span></div>';
        html += '<canvas></canvas>';
        html += '<div class="sck-x"><span class="sck-tmin">—</span><span class="sck-tmax">—</span></div>';
        html += '</div></div>';
      });
      html += "</div>";
      return html;
    }

    function ensureChartPopup() {
      if (!marker || !kitConnected) return;
      if (marker.getPopup()) return;
      marker.bindPopup(chartPopupHtml(), {
        maxWidth: 420,
        minWidth: 340,
        className: "sck-popup",
        autoPan: true,
        autoClose: false,
        closeOnClick: false
      });
    }

    function setChartTooltip() {
      if (!marker || !marker.getTooltip()) return;
      marker.setTooltipContent(
        kitConnected
          ? "Click the marker to open the charts"
          : "Connect the kit, then click the marker for charts"
      );
    }

    window.sckKit = function (on) {
      kitConnected = !!on;
      setChartTooltip();
      if (!kitConnected) {
        chartData = [];
        openOnFirstReading = false;
        if (marker && marker.isPopupOpen()) marker.closePopup();
        if (marker && marker.getPopup()) marker.unbindPopup();
        return;
      }
      openOnFirstReading = true;
      ensureChartPopup();
    };

    function rowTime(row) {
      const t = Number(row.ts != null ? row.ts : row._ts);
      return Number.isFinite(t) ? t : null;
    }

    function trimChartData() {
      const cutoff = Date.now() / 1000 - CHART_WINDOW_S;
      const kept = [];
      chartData.forEach(function (row) {
        const t = rowTime(row);
        if (t == null || t >= cutoff) kept.push(row);
      });
      if (kept.length > 3600) {
        chartData = kept.slice(kept.length - 3600);
      } else {
        chartData = kept;
      }
    }

    function formatAxisNum(v) {
      if (!Number.isFinite(v)) return "—";
      const a = Math.abs(v);
      if (a >= 1000) return v.toFixed(0);
      if (a >= 100) return v.toFixed(1);
      return v.toFixed(2);
    }

    function formatAxisTime(ts) {
      if (ts == null || !Number.isFinite(Number(ts))) return "time";
      const d = new Date(Number(ts) * 1000);
      if (Number.isNaN(d.getTime())) return "time";
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function seriesPoints(rows, key) {
      const pts = [];
      (rows || []).forEach(function (row) {
        const v = Number(row[key]);
        const t = rowTime(row);
        if (Number.isFinite(v) && t != null) pts.push({ t: t, v: v });
      });
      return pts;
    }

    function drawSpark(canvas, pts, color) {
      const dpr = window.devicePixelRatio || 1;
      const cssW = canvas.clientWidth || 140;
      const cssH = canvas.clientHeight || 48;
      canvas.width = Math.max(1, Math.round(cssW * dpr));
      canvas.height = Math.max(1, Math.round(cssH * dpr));
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cssW, cssH);
      if (!pts.length) return;
      const vals = pts.map(function (p) { return p.v; });
      const min = Math.min.apply(null, vals);
      const max = Math.max.apply(null, vals);
      const span = max - min || 1;
      const t0 = pts[0].t;
      const t1 = pts[pts.length - 1].t;
      const tspan = t1 - t0 || 1;
      const padL = 1;
      const padR = 3;
      const padT = 3;
      const padB = 3;
      const innerW = cssW - padL - padR;
      const innerH = cssH - padT - padB;
      ctx.strokeStyle = "rgba(0,0,0,0.12)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padL, padT);
      ctx.lineTo(padL, cssH - padB);
      ctx.lineTo(cssW - padR, cssH - padB);
      ctx.stroke();
      ctx.beginPath();
      pts.forEach(function (p, i) {
        const x = pts.length === 1 ? padL : padL + ((p.t - t0) / tspan) * innerW;
        const y = cssH - padB - ((p.v - min) / span) * innerH;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.6;
      ctx.lineJoin = "round";
      ctx.stroke();
      const last = pts[pts.length - 1];
      const lastX = pts.length === 1 ? padL : padL + ((last.t - t0) / tspan) * innerW;
      const lastY = cssH - padB - ((last.v - min) / span) * innerH;
      ctx.beginPath();
      ctx.arc(lastX, lastY, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function redrawCharts() {
      const popup = marker && marker.getPopup && marker.getPopup();
      if (!popup) return;
      const el = popup.getElement();
      if (!el) return;
      const empty = el.querySelector("#sck-charts-empty");
      if (empty) empty.style.display = chartData.length ? "none" : "block";
      const caption = el.querySelector("#sck-charts-caption");
      if (caption) {
        caption.textContent = chartData.length
          ? (chartData.length + " samples · up to 30 min")
          : "Up to 30 minutes";
      }
      SERIES.forEach(function (s) {
        const box = el.querySelector('.sck-chart[data-key="' + s.key + '"]');
        if (!box) return;
        const pts = seriesPoints(chartData, s.key);
        const valEl = box.querySelector(".val");
        if (valEl) {
          valEl.textContent = pts.length ? pts[pts.length - 1].v.toFixed(2) : "—";
        }
        const ymax = box.querySelector(".sck-ymax");
        const ymin = box.querySelector(".sck-ymin");
        const tmin = box.querySelector(".sck-tmin");
        const tmax = box.querySelector(".sck-tmax");
        if (pts.length) {
          const vals = pts.map(function (p) { return p.v; });
          const lo = Math.min.apply(null, vals);
          const hi = Math.max.apply(null, vals);
          if (ymax) ymax.textContent = formatAxisNum(hi);
          if (ymin) ymin.textContent = formatAxisNum(lo);
          if (tmin) tmin.textContent = formatAxisTime(pts[0].t);
          if (tmax) tmax.textContent = formatAxisTime(pts[pts.length - 1].t);
        } else {
          if (ymax) ymax.textContent = "—";
          if (ymin) ymin.textContent = "—";
          if (tmin) tmin.textContent = "—";
          if (tmax) tmax.textContent = "—";
        }
        const canvas = box.querySelector("canvas");
        if (canvas) drawSpark(canvas, pts, s.color);
      });
    }

    window.sckCharts = function (points) {
      if (!Array.isArray(points)) return;
      if (!points.length) {
        chartData = [];
      } else {
        const incoming = points[points.length - 1];
        const copy = {};
        Object.keys(incoming).forEach(function (k) { copy[k] = incoming[k]; });
        const incomingTs = Number(incoming.ts != null ? incoming.ts : incoming._ts);
        copy.ts = Number.isFinite(incomingTs) ? incomingTs : Date.now() / 1000;
        copy._ts = copy.ts;
        chartData.push(copy);
        trimChartData();
      }
      if (!marker || !kitConnected) return;
      ensureChartPopup();
      if (points.length && openOnFirstReading && !marker.isPopupOpen()) {
        openOnFirstReading = false;
        marker.openPopup();
      }
      if (marker.isPopupOpen()) {
        requestAnimationFrame(redrawCharts);
      }
    };

    function initMap(attempt) {
      attempt = attempt || 0;
      if (typeof L === "undefined") {
        if (attempt < 40) {
          setTimeout(function () { initMap(attempt + 1); }, 50);
        } else {
          var hint = document.querySelector(".hint");
          if (hint) hint.textContent = "Map library failed to load.";
        }
        return;
      }
      if (map) {
        map.invalidateSize();
        return;
      }
      map = L.map("map", { closePopupOnClick: false }).setView([20, 0], 2);
      window.map = map;
      if (map._container) {
        map._container.classList.add("leaflet-crosshair");
      }
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);
      map.on("click", function (e) {
        setMarker(e.latlng.lat, e.latlng.lng, false);
      });
      setTimeout(function () { map.invalidateSize(); }, 200);
    }

    window.sckBoot = function (lat, lon) {
      const la = Number(lat);
      const lo = Number(lon);
      initMap();
      if (Number.isFinite(la) && Number.isFinite(lo)) {
        setMarker(la, lo, true);
      }
    };

    function locateWithBrowser() {
      if (!navigator.geolocation) return false;
      navigator.geolocation.getCurrentPosition(function (pos) {
        setMarker(pos.coords.latitude, pos.coords.longitude, true);
      }, function (err) {
        console.log("geolocation error " + err.code + " " + err.message);
      }, { enableHighAccuracy: true, timeout: 18000, maximumAge: 60000 });
      return true;
    }

    function onLocate() {
      if (bridge && bridge.requestLocation) {
        bridge.requestLocation();
        return;
      }
      locateWithBrowser();
    }

    function start() {
      document.getElementById("locate").onclick = onLocate;
      initMap();
      if (typeof qt !== "undefined" && qt.webChannelTransport && typeof QWebChannel === "function") {
        new QWebChannel(qt.webChannelTransport, function (channel) {
          bridge = channel.objects.bridge;
        });
      }
    }

    start();
  </script>
</body>
</html>
